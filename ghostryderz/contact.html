        <p>Replace this form action with your backend or form service later.</p>

        <form style="margin-top:16px; display:grid; gap:12px; max-width:520px;">
          <input
            style="padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,0.12); background:#0f0f0f; color:#fff;"

          />

            style="padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,0.12); background:#0f0f0f; color:#fff;"
